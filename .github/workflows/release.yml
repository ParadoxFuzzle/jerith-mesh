name: release

# Tag-push (v*) builds release binaries for both platforms and attaches
# them, with sha256 checksums, to the matching GitHub release. The first
# automated macOS binaries come from here — the macos test job proved the
# debug profile; this workflow proves the release profile (lto = thin).
#
# Artifact scope (decision 2026-10-28): the TWO first-party daemons ship
# — the mesh node (`jerith`) and the Discord bot (`jerith-bot`) — one
# artifact each per OS+arch. Nothing else from the workspace's nine
# binaries ships, and for once there's a reason rather than momentum:
# the plugin binaries are meaningless outside their per-host signed
# manifest + `[plugins]` row in bot.toml (PLUGINS.md's contract),
# `plugin-template` is an author's scaffold, and `gcp-bridge` is a
# box-local ops utility. The read for anyone wanting_more: if the plugin
# lane grows a real distribution channel (downloadable signed bundles),
# THAT is the trigger to revisit shipping plugin artifacts — not
# "workspace builds more binaries".
#
# workflow_dispatch (invoked without a tag ref) dry-runs the same builds
# WITHOUT touching any release — use it to validate a platform change
# before cutting a tag:
#   gh workflow run release.yml --repo ParadoxFuzzle/jerith-mesh --ref main
#
# Operators verify via `sha256sum -c jerith[-bot]-<os>-<arch>.sha256`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-audit:
    # Pre-release advisory gate: no tag builds or ships binaries until
    # the workspace audit is clean. Same policy as ci.yml's push-time
    # dependency-audit job (the six accepted serenity-websocket
    # advisories in .cargo/audit.toml are the only exceptions), but
    # evaluated NOW — the moment of the release cut, not the moment of
    # the last push that may be weeks older. The manual pre-release
    # audit reminder this replaces was the long tail of that gap.
    name: cargo audit (pre-release advisory gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the dependency graph before anything ships
        run: cargo audit

  binaries:
    needs: dependency-audit
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: macos-latest
            arch: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JERITH_OK_BEYOND_CAPACITY: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries (workspace)
        run: cargo build --release --workspace
      - name: Stage artifacts + sha256
        # sha256sum is not a native macOS binary — fall back to perl
        # shasum with identical output format; either way the verify
        # re-check must fail the step on a mismatch.
        run: |
          set -euo pipefail
          for BIN in jerith jerith-bot; do
            ART="${BIN}-${{ matrix.arch }}"
            cp "target/release/${BIN}" "${ART}"
            ( sha256sum "${ART}" || shasum -a 256 "${ART}" ) > "${ART}.sha256"
            ( sha256sum -c "${ART}.sha256" || shasum -a 256 -c "${ART}.sha256" )
            cat "${ART}.sha256"
          done
      - name: Upload binaries + checksums to the tag's release
        # Real releases only — a dispatch dry-run from a branch ref has no
        # tag and must not touch any release object.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag \
              --title "jerith-mesh $TAG" \
              --notes "Automated release binaries for $TAG (source of truth: this tag; checksums per asset)."
          UPLOAD=()
          for BIN in jerith jerith-bot; do
            ART="${BIN}-${{ matrix.arch }}"
            UPLOAD+=("${ART}" "${ART}.sha256")
          done
          gh release upload "$TAG" "${UPLOAD[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
