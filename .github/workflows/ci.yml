name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-linux:
    name: cargo test --workspace (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the full workspace test suite
        run: cargo test --workspace

  tests-macos:
    # macOS parity for the test suite (first-install operators on Apple
    # hardware rely on the same code paths: rusqlite bundled, quinn, sysinfo
    # probing with its non-inxi fallback). The E2E stays Linux-only.
    name: cargo test --workspace (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the full workspace test suite
        run: cargo test --workspace

  dev-e2e:
    name: two-node live E2E (scripts/dev-e2e.sh)
    runs-on: ubuntu-latest
    needs: tests-linux
    timeout-minutes: 30
    env:
      # CI runners are smaller than a mesh dev box; the one-command E2E
      # sets up two nodes with a curated int4 model against a stub
      # runtime, so exceeding the hardware scan's capacity math is fine
      # here (no real weights are ever loaded).
      JERITH_OK_BEYOND_CAPACITY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: One-command two-node E2E (builds, boots, verifies, tears down)
        run: bash scripts/dev-e2e.sh

  dependency-audit:
    # Advisory gate: a NEW RUSTSEC advisory anywhere in any crate's
    # dependency graph fails the build (releases can't land on it). The
    # six accepted serenity-websocket advisories are the ONLY exceptions,
    # via .cargo/audit.toml — each points to its rationale in
    # docs/RUNBOOK.md → "Dependency security posture". Delete that file's
    # entries (and rerun this gate clean) when the serenity/poise
    # migration lands.
    name: cargo audit (dependency advisories gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Advisory scan (fails on anything not documented as accepted)
        run: cargo audit
