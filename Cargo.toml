[workspace]
members = ["crates/node", "crates/bot", "crates/gcp-bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"   # edition 2024 minimum; enforced by cargo
license = "MIT OR Apache-2.0"
repository = "https://github.com/ParadoxFuzzle/jerith-mesh"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.39"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
futures-core = "0.3"
futures-util = "0.3"
quinn = "0.11"
# "rustls-tls-webpki-roots" (NOT the bare "rustls" surface: that is the
# implicit optional-dep feature — it pulls the rustls CRATE but not
# tokio-rustls, so connect_async reports «TLS support not compiled in»
# at runtime; found live 2026-10-21 on the voice lane). webpki-roots
# rides the same 0.26 line as the serenity websocket subgraph.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Discord voice (voice.rs — always-on VC lane): explicit feature set, NOT
# defaults — the default feature list pulls native-tls/webcrypto flights
# that collate with the workspace rustls = ring pin (the 2026-10-19
# dual-provider lesson). "receive" brings the Opus packet pipeline this
# lane's capture side feeds the Gemini Live WS with.
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "rustls", "serenity", "tungstenite", "receive"] }
regex = "1"
base64 = "0.22"
poise = "0.7"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = "thin"
