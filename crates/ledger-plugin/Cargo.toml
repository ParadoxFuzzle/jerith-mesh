[package]
name = "jerith-ledger-plugin"
version.workspace = true
edition.workspace = true
description = "jerith-mesh ledger plugin: the task-ledger / intentions lane over the signed plugin SDK contract"

[[bin]]
name = "jerith-ledger"
path = "src/main.rs"

[dependencies]
jerith-plugin-template = { path = "../plugin-template" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
