[package]
name = "jerith-mesh-bot"
version.workspace = true
edition.workspace = true
description = "jerith-mesh Discord bot: slash commands bridging Discord to a mesh gateway and JerithChain mining"

[[bin]]
name = "jerith-bot"
path = "src/main.rs"

[dependencies]
jerith-mesh-core = { path = "../core" }
poise.workspace = true
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
reqwest = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
base64.workspace = true
futures-util.workspace = true
# Approval-request ids (40-bit unguessable codes; see approval.rs).
rand.workspace = true
tokio-postgres = "0.7"
# MongoDB (Atlas) native driver — [mongo] in bot.toml (mongo.rs).
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-2", "compat-3-3-0", "dns-resolver", "zlib-compression"] }
tokio-tungstenite = { workspace = true }
futures-channel = "0.3"
# External chat transports (FEATURES §17): IRC TLS builds its own client
# config out of tokio-rustls + the webpki root store — both already in
# the tree through tokio-tungstenite's rustls feature, now direct deps.
# default-features OFF: the defaults activate rustls/aws_lc_rs, which
# collides with the workspace pin (ring) → provider ambiguity panics at
# quic test init (the 2026-10-19 CI dual-provider failure). No feature
# on this line: the provider comes from the workspace rustls pin only.
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
# Webhook in-box (webinbox.rs): the loopback listener the push-only
# platforms route through (Teams, Google Chat, WhatsApp, Slack Events).
axum.workspace = true

[dev-dependencies]
# Mock gateway for the chat tool-loop test (web skills integration).
axum.workspace = true
