[package]
name = "jerith-plugin-template"
version.workspace = true
edition.workspace = true
description = "Phase 3d plugin SDK (docs/PLUGIN-SDK.md): the signed-dispatch service contract as a library, packaged with a copyable example so an author ships a plugins.d drop without touching the bot."

[[bin]]
name = "jerith-plugin-example"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
futures-util = { workspace = true }
# The ONE signing recipe (docs/PLUGIN-SDK.md + hooks.rs): HMAC-SHA256 over
# "{ts_ms}.{body}", hex — learned once, verified on every direction.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
reqwest = { workspace = true }
