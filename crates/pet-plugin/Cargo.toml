[package]
name = "jerith-pet-plugin"
version.workspace = true
edition.workspace = true
description = "The mesh pet: a persistent void-companion served over the plugin SDK's signed /rpc contract — time decays it, interactions raise it, and it remembers notes the model passes down. Phase 3d's second real consumer (docs/PLUGIN-SDK.md)."

[[bin]]
name = "jerith-pet"
path = "src/main.rs"

[dependencies]
jerith-plugin-template = { path = "../plugin-template" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
