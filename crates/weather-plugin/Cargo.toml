[package]
name = "jerith-weather-plugin"
version.workspace = true
edition.workspace = true
description = "The mesh weather skill: open-meteo.com geocoding + forecast served over the plugin SDK's signed /rpc contract — two model-visible skills (weather.now / weather.forecast), pure parsing in lib.rs, wire glue in main.rs (docs/PLUGIN-SDK.md)."

[[bin]]
name = "jerith-weather"
path = "src/main.rs"

[dependencies]
jerith-plugin-template = { path = "../plugin-template" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Upstream is api.open-meteo.com (public HTTPS); the workspace rustls =
# ring pin stays untouched — same non-default feature discipline as the
# bot's reqwest line (Cargo.toml comment).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
