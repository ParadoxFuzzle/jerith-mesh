[package]
name = "jerith-quarantine-plugin"
version.workspace = true
edition.workspace = true
description = "jerith-mesh quarantine plugin: the download-quarantine lane over the signed plugin SDK contract"

[[bin]]
name = "jerith-quarantine"
path = "src/main.rs"

[dependencies]
jerith-plugin-template = { path = "../plugin-template" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Sample identification (the hash-the-dropper step of the 2026-10-23
# hand run) — no new crypto provider surfaces: plain sha2 hashing, no
# TLS involvement at all in this crate.
sha2 = "0.10"
# The archive half: raw-DEFLATE decode of zip-family entries (jar/zip),
# pure Rust, tiny, no TLS/provider surface — collides with nothing in
# the workspace pins (checked 2026-10-23 against the rustls/ring line).
miniz_oxide = "0.8"
